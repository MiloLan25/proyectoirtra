<!-- 1. CAMILO PDF -->
<div class="expo-card" data-category="pdf" data-title="camilo">
  <div class="card-header">
    <div class="card-title">
      <i data-lucide="file-text" color="#ec4899"></i>
      <h3>Camilo</h3>
    </div>
    <span class="badge badge-pdf">PDF</span>
  </div>

  <div class="preview-box">
    <iframe 
      src="Camilo.pdf#toolbar=0" 
      title="Vista Previa Camilo">
    </iframe>
  </div>

  <div class="card-footer">
    <span class="views-counter" id="views-doc1">
      <i data-lucide="eye" size="14"></i> 0 vistas
    </span>

    <button 
      class="action-btn" 
      onclick="openModal('Camilo.pdf', 'pdf', 'doc1', this)">
      <i data-lucide="maximize-2" size="14"></i> Ampliar Vista
    </button>
  </div>
</div>

<!-- 3. PROYECTO VIDEO -->
<div class="expo-card" data-category="video" data-title="proyecto">
  <div class="card-header">
    <div class="card-title">
      <i data-lucide="video" color="#06b6d4"></i>
      <h3>Proyecto</h3>
    </div>
    <span class="badge badge-video">Video</span>
  </div>

  <div class="preview-box">
    <video 
      controls 
      preload="metadata" 
      onplay="countView('doc3')">
      <source src="proyecto.mp4" type="video/mp4">
      Tu navegador no soporta el formato de video.
    </video>
  </div>

  <div class="card-footer">
    <span class="views-counter" id="views-doc3">
      <i data-lucide="eye" size="14"></i> 0 vistas
    </span>

    <button 
      class="action-btn" 
      onclick="openModal('proyecto.mp4', 'video', 'doc3', this)">
      <i data-lucide="maximize-2" size="14"></i> Pantalla Completa
    </button>
  </div>
</div>
